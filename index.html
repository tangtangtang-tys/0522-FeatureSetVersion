<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>功能集版本管理平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="平台导航">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-kicker">Camera IoT</p>
            <h1>功能集工作台</h1>
          </div>
        </div>

        <nav class="module-nav" id="moduleNav" aria-label="功能模块"></nav>

        <section class="side-panel">
          <p class="side-label">设计原则</p>
          <strong>先定义能力，再沉淀版本</strong>
          <span>功能集回答“管什么能力”，版本回答“这一版支持什么”。启用后保留快照，后续通过复制迭代。</span>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Camera IoT Capability Console</p>
            <h2 id="pageTitle">功能集版本工作台</h2>
          </div>
          <div class="top-actions">
            <button class="ghost-action" type="button" data-action="import-sets">导入功能集</button>
            <button class="ghost-action" type="button" data-action="import-versions">导入版本</button>
            <button class="ghost-action" id="exportButton" type="button">导出视图</button>
            <button class="primary-action" id="reviewButton" type="button">新增版本</button>
          </div>
        </header>

        <section class="command-strip" aria-label="筛选工具">
          <label class="search-box">
            <span>查询</span>
            <input id="globalSearch" type="search" placeholder="搜索功能集名称、编码、版本号或支持能力" />
          </label>
          <label>
            <span>功能分类</span>
            <select id="categoryFilter"></select>
          </label>
          <label>
            <span>状态筛选</span>
            <select id="statusFilter"></select>
          </label>
          <button class="ghost-action" id="resetFilters" type="button">重置</button>
        </section>

        <section id="content" class="content-grid" aria-live="polite"></section>
      </main>
    </div>

    <aside class="detail-drawer" id="detailDrawer" aria-label="详情面板" aria-hidden="true">
      <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭详情">×</button>
      <div id="drawerContent"></div>
    </aside>
    <div class="drawer-mask" id="drawerMask"></div>

    <script src="./app.js"></script>
  </body>
</html>
