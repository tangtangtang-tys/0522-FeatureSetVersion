<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>功能集管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="平台导航">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-kicker">Camera IoT</p>
            <h1>功能集管理</h1>
          </div>
        </div>

        <nav class="module-nav" id="moduleNav" aria-label="功能模块"></nav>

        <section class="side-panel">
          <p class="side-label">管理口径</p>
          <strong>能力边界清晰，版本快照可追溯</strong>
          <span>功能集定义能力范围，版本记录每次可引用的能力承诺。</span>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="topbar-main">
            <h2 id="pageTitle">功能集管理</h2>
            <p class="page-subtitle">本模块用于维护功能集及其版本记录，帮助团队统一定义能力边界、管理版本沉淀，并快速查看当前功能集支持的能力内容。</p>
          </div>
          <div class="top-actions">
            <button class="ghost-action" type="button" data-action="bulk-import">批量导入</button>
          </div>
        </header>

        <section id="content" class="content-grid" aria-live="polite"></section>
      </main>
    </div>

    <aside class="detail-drawer" id="detailDrawer" aria-label="详情面板" aria-hidden="true">
      <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭详情">×</button>
      <div id="drawerContent"></div>
    </aside>
    <div class="drawer-mask" id="drawerMask"></div>

    <script src="./app.js"></script>
  </body>
</html>
